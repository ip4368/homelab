[package]
name = "server"
edition.workspace = true
version.workspace = true

[dependencies]
control = { path = "../control" }
model = { path = "../model" }
sim = { path = "../sim" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
